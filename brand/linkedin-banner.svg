<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396" role="img" aria-label="Business Process Redesign - Spare some time, so we can save yours.">
  <title>Business Process Redesign</title>
  <!--
    LinkedIn company banner. LinkedIn overlays the circular profile photo on the left
    edge, covering roughly the first 330px on desktop; nothing here starts before x=410
    (the mark) or x=620 (the text), both comfortably clear of that zone.

    No client name, client result or number anywhere - just the mark, the display name and
    the one approved slogan. Font stack is the site's own system stack (no CDN fonts, no
    third-party requests).
      background #2f3b52  (the slate)
      heading    #ffffff  11.24:1 on the slate
      slogan     #b8c3d9  6.34:1 on the slate (slogan text is 26px, counts as "large text";
                           needs only 3:1)
      mark spokes #b8c3d9 6.34:1 on the slate; mark hub+nodes #ffffff 11.24:1 on the slate
    All ratios measured with tools/contrast.py.
  -->
  <rect width="1584" height="396" fill="#2f3b52"/>
  <g transform="translate(480,198) scale(4.667) translate(-16,-16)">
    <path d="M16 16L6 8M16 16L26 9M16 16L9 26M16 16L25 24" stroke="#b8c3d9" stroke-width="1.2" fill="none"/>
    <circle cx="16" cy="16" r="3.6" fill="#ffffff"/>
    <circle cx="6" cy="8" r="2.2" fill="#ffffff"/>
    <circle cx="26" cy="9" r="2.2" fill="#ffffff"/>
    <circle cx="9" cy="26" r="2.2" fill="#ffffff"/>
    <circle cx="25" cy="24" r="2.2" fill="#ffffff"/>
  </g>
  <text x="620" y="190" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Business Process Redesign</text>
  <text x="620" y="236" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#b8c3d9">Spare some time, so we can save yours.</text>
</svg>
