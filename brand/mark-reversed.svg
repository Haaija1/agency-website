<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Business Process Redesign">
  <title>Business Process Redesign</title>
  <!--
    Same geometry as mark.svg (and favicon.svg), recoloured for dark/slate backgrounds:
    the WhatsApp profile photo, the LinkedIn banner, any slide or document with a slate
    cover page. Transparent background so it drops onto whatever dark fill is already there.

    Colours are literal hex, never a CSS custom property reference, for the same reason
    as mark.svg: this file is loaded standalone.
      spokes    #b8c3d9  6.34:1 on the slate background (#2f3b52) - measured with tools/contrast.py
      hub+nodes #ffffff  11.24:1 on the slate background (#2f3b52)
  -->
  <path d="M16 16L6 8M16 16L26 9M16 16L9 26M16 16L25 24" stroke="#b8c3d9" stroke-width="1.2" fill="none"/>
  <circle cx="16" cy="16" r="3.6" fill="#ffffff"/>
  <circle cx="6" cy="8" r="2.2" fill="#ffffff"/>
  <circle cx="26" cy="9" r="2.2" fill="#ffffff"/>
  <circle cx="9" cy="26" r="2.2" fill="#ffffff"/>
  <circle cx="25" cy="24" r="2.2" fill="#ffffff"/>
</svg>
