<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Business Process Redesign">
  <title>Business Process Redesign</title>
  <!--
    Share image, 1200x630 (1.91:1, the size every platform crops to).

    The mark and the name. Nothing else: no tagline, no numbers, no claim about results, no
    client name, no domain. The only thing this image asserts is what the company is called.

    Colours are the site's B3 slate-and-one-blue palette as literal hex, because an SVG used as
    an og:image is a standalone document and never sees styles.css or its custom properties:
      page       #ffffff
      frame      #e3e7ed   (--line)
      name       #2f3b52   (--ink)       11.24:1 on white
      accent     #1f5bc0   (--link)       6.33:1 on white
      mark       the favicon's own colours, unchanged
    Measured with python tools/contrast.py.

    'Inter' leads the font stack here, rather than sitting mid-stack as it does in styles.css,
    so that rasterising this file is deterministic: Inter is installed and the PNG beside it is
    baked from this SVG. The rest of the stack is the site's, for anyone opening the SVG itself.
  -->

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#e3e7ed" stroke-width="1"/>

  <!-- The hub-and-spokes mark, scaled from its 32-unit grid to 112px. -->
  <g transform="translate(96 135) scale(3.5)">
    <rect width="32" height="32" rx="7" fill="#1a1a1a"/>
    <path d="M16 16L6 8M16 16L26 9M16 16L9 26M16 16L25 24" stroke="#8a8a86" stroke-width="1.2" fill="none"/>
    <circle cx="16" cy="16" r="3.6" fill="#ffffff"/>
    <circle cx="6" cy="8" r="2.2" fill="#ffffff"/>
    <circle cx="26" cy="9" r="2.2" fill="#ffffff"/>
    <circle cx="9" cy="26" r="2.2" fill="#ffffff"/>
    <circle cx="25" cy="24" r="2.2" fill="#ffffff"/>
  </g>

  <!-- The name, on two lines so it stays well inside the 96px margin at this width. -->
  <g fill="#2f3b52" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="600" letter-spacing="-2.5">
    <text x="96" y="372">Business Process</text>
    <text x="96" y="476">Redesign</text>
  </g>

  <!-- One short blue rule: the same accent the page uses on its section kickers. -->
  <rect x="96" y="520" width="72" height="4" rx="2" fill="#1f5bc0"/>
</svg>
